name: Release

# Run manually from the Actions tab: builds the installers on a clean runner and drafts a
# GitHub Release for the given tag (created from the selected branch if it doesn't exist).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.1"
        required: true

permissions:
  contents: write

jobs:
  windows:
    name: Windows installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build and draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: KeyHalo ${{ inputs.tag }}
          releaseBody: |
            See the [changelog and release notes](https://github.com/Brokenwatch24/keyhalo/blob/main/CHANGELOG.md) for what's new.

            **Install:** download `KeyHalo_*_x64-setup.exe` (recommended) or the `.msi` below.
            `keyhalo-cli.exe` is the optional command-line client for the local API.
          releaseDraft: true
          prerelease: false
          args: --bundles nsis,msi

      - name: Build and attach CLI
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo build --release --manifest-path cli/Cargo.toml
          cp cli/target/release/keyhalo.exe keyhalo-cli.exe
          gh release upload "${{ inputs.tag }}" keyhalo-cli.exe --clobber
