[package]
name = "keyhalo"
version = "1.1.0"
description = "Open-source studio for keyboards and mice: per-key RGB lighting, DPI tuning, per-app keymaps, macros, a typing trainer and community-shared profiles."
authors = ["KeyHalo contributors"]
license = "MIT"
repository = "https://github.com/Brokenwatch24/keyhalo"
edition = "2021"
rust-version = "1.80"

[lib]
name = "keyhalo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
uuid = { version = "1", features = ["v4"] }
hidapi = "2"
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "charset", "http2"] }
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["cors"] }
sysinfo = "0.35"
nvml-wrapper = "0.11"
rustfft = "6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "ApplicationModel",
  "Foundation",
  "Foundation_Collections",
  "Foundation_Numerics",
  "Devices_Enumeration",
  "Devices_Lights",
  "System",
  "UI",
  "UI_Notifications",
  "UI_Notifications_Management",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dwm",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Media_KernelStreaming",
  "Win32_Media_Multimedia",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_Devices_Properties",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true
