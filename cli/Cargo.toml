[package]
name = "keyhalo-cli"
version = "1.0.0"
description = "Command-line client for KeyHalo's local API (status, actions, notifications, Claude Code hooks)."
license = "MIT"
repository = "https://github.com/Brokenwatch24/keyhalo"
edition = "2021"

[[bin]]
name = "keyhalo"
path = "src/main.rs"

[dependencies]
# Plain HTTP to 127.0.0.1 only: no TLS stack needed.
ureq = { version = "3", default-features = false }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
